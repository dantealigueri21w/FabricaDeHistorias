name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      # Se publica el APK de depuración, firmado con la llave por defecto.
      # assembleRelease sin firmar produce un APK que no se puede instalar.
      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/FabricaDeHistorias.v1.0.0.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          files: salida/*.apk
